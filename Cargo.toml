[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "LGPL-3.0-only"

[workspace.dependencies]
cxx = "1.0"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml"] }
cxx-qt-build = "0.10.0"
zbus = "5.19"
wayland-client = "0.31.15"
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Line tables keep backtraces readable at a fraction of full debuginfo (16 GB of target/debug).
[profile.dev]
debug = "line-tables-only"
