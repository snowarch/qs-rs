# Private PipeWire daemon for tests/qml/pipewire.qml: two null nodes and the default metadata,
# no session manager and no D-Bus.
context.properties = {
    core.daemon = true
    core.name = pipewire-0
    support.dbus = false
    module.x11.bell = false
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-access }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-link-factory }
]
context.objects = [
    { factory = metadata
      args = { metadata.name = default
               metadata.values = [ { key = default.audio.sink value = { name = qsrs-test-sink } } ] } }
    { factory = adapter
      args = { factory.name = support.null-audio-sink node.name = qsrs-test-sink
               node.description = "QsRs Test Sink" node.nick = "Test Sink" media.class = Audio/Sink
               audio.position = [ FL FR ] object.linger = true monitor.channel-volumes = true } }
    { factory = adapter
      args = { factory.name = support.null-audio-sink node.name = qsrs-test-source
               node.description = "QsRs Test Source" media.class = Audio/Source
               audio.position = [ FL FR ] object.linger = true } }
]
